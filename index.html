<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Battle Arena</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container py-4"> 
    <h1 class="text-center mb-4">Pokémon Battle Arena</h1>

    <!-- pantalla 1 (escoger pokemones)-->
    <div id="pantalla-1"> 

      <!-- BOOTSTRAP: row/col para poner las 2 tarjetas lado a lado -->
      <div class="row">

        <!-- tarjeta pokemon 1 -->
        <div class="col-md-6 mb-3">
          <div class="card p-3 position-relative">
            <h3 class="text-center">Pokémon 1</h3>

            <input
              type="text"
              id="busqueda-1"
              class="form-control mb-2"
              placeholder="Elegir Pokémon..."
              autocomplete="off"
            />

            <!-- sugerencias de búsqueda -->
            <ul id="mensaje-error-1" class="list-group"></ul>

            <!-- sprite, hp y movimientos -->
            <div id="pokemon-info-1" class="text-center mt-3"></div>
          </div>
        </div>

        <!-- Tarjeta Pokémon 2 -->
        <div class="col-md-6 mb-3">
          <div class="card p-3 position-relative">
            <h3 class="text-center">Pokémon 2</h3>

            <input
              type="text"
              id="busqueda-2"
              class="form-control mb-2"
              placeholder="Elegir Pokémon..."
              autocomplete="off"
            />

            <!-- sugerencias de búsqueda -->
            <ul id="mensaje-error-2" class="list-group"></ul>

            <!-- sprite, hp y movimientos -->
            <div id="pokemon-info-2" class="text-center mt-3"></div>
          </div>
        </div>

      </div>

      <!-- boton para empezar la batalla -->
      <div class="text-center mt-3">
        <button id="iniciar-batalla-btn" class="btn btn-primary" disabled>
          Iniciar batalla
        </button>
      </div>
    </div>

    <!-- pantalla 2 (batalla)-->
    <div id="pantalla-batalla" class="d-none">
      <div class="row">
 
        <!-- jugador 1 -->
        <div class="col-md-6 mb-3">
          <div class="card p-3 text-center">
            <h3 id="batalla-nombre-1" class="text-capitalize"></h3>
 
            <!-- la imagen va sola en un div para aplicarle borde rojo al recibir un ataque -->
            <img id="batalla-sprite-1" src="" alt="" class="pokemon-sprite d-block mx-auto" />
 
            <!-- progress/progress-bar de bootstrap -->
            <div class="progress my-2">
              <div id="batalla-hp-barra-1" class="progress-bar bg-success" style="width: 100%"></div>
            </div>
            <p id="batalla-hp-texto-1"></p>
 
            <div id="batalla-movimientos-1" class="d-grid gap-2"></div>
          </div>
        </div>
 
        <!-- jugador 2 -->
        <div class="col-md-6 mb-3">
          <div class="card p-3 text-center">
            <h3 id="batalla-nombre-2" class="text-capitalize"></h3>
 
            <img id="batalla-sprite-2" src="" alt="" class="pokemon-sprite d-block mx-auto" />
 
            <div class="progress my-2">
              <div id="batalla-hp-barra-2" class="progress-bar bg-success" style="width: 100%"></div>
            </div>
            <p id="batalla-hp-texto-2"></p>
 
            <div id="batalla-movimientos-2" class="d-grid gap-2"></div>
          </div>
        </div>
 
      </div>
 
      <div id="resultado-batalla" class="text-center mt-3"></div>
 
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
